<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Alquimia das Páginas</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-header { background:var(--papel); border-bottom:1px solid var(--borda); padding:16px 0; }
        .admin-header .container,.painel-topo { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
        .admin-header strong { font-family:var(--display); font-size:1.15rem; color:var(--primaria-escura); }
        .admin-nav { display:flex; gap:16px; align-items:center; }
        .admin-nav a { color:var(--suave); text-decoration:none; }
        .btn-sair { background:var(--primaria); color:#faf3e6 !important; padding:8px 16px; border-radius:6px; border:0; cursor:pointer; font:inherit; }
        .painel-conteudo { padding:40px 0 80px; }
        .painel-topo { margin-bottom:24px; }
        .painel-topo h1 { font-family:var(--titulo); font-size:2rem; color:var(--primaria-escura); margin:0; }
        .tabela-box { background:var(--papel); border:1px solid var(--borda); border-radius:var(--raio); box-shadow:var(--sombra); overflow:auto; }
        table { width:100%; border-collapse:collapse; }
        thead { background:var(--primaria); color:#faf3e6; }
        th,td { padding:13px 16px; text-align:left; }
        tbody tr { border-bottom:1px solid var(--borda); }
        .campo { margin-bottom:16px; }
        .campo label { display:block; font-weight:600; margin-bottom:6px; }
        .campo input,.campo select { width:100%; padding:11px 12px; border:1px solid var(--borda); border-radius:7px; font:inherit; background:#fff; }
        .form-livro { background:var(--papel); border:1px solid var(--borda); border-radius:var(--raio); padding:24px; margin-bottom:28px; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:0 18px; }
        .acoes { display:flex; gap:8px; }
        .mensagem { margin:16px 0; color:var(--primaria-escura); }
        @media(max-width:680px) { th,td { padding:10px; font-size:.9rem; } }
    </style>
</head>
<body>
<header class="admin-header">
    <div class="container">
        <strong>Painel Administrativo</strong>
        <nav class="admin-nav">
            <a href="../index.html">Ver site</a>
            <button type="button" class="btn-sair" id="btnSair">Sair</button>
        </nav>
    </div>
</header>

<div class="container">
    <p id="avisoInicial" class="mensagem" role="status" hidden></p>
</div>

<main class="painel-conteudo" id="painel" hidden>
    <div class="container">
        <div class="painel-topo">
            <h1>Livros cadastrados</h1>
            <button type="button" class="btn-primario" id="btnNovo">Novo livro</button>
        </div>
        <p id="avisoPainel" class="mensagem" role="status" hidden></p>

        <form id="formLivro" class="form-livro" hidden>
            <h2 id="formTitulo">Novo livro</h2>
            <input type="hidden" id="livroId">
            <div class="form-grid">
                <div class="campo">
                    <label for="nome">Título</label>
                    <input id="nome" required maxlength="150">
                </div>
                <div class="campo">
                    <label for="autor">Autor</label>
                    <input id="autor" required maxlength="100">
                </div>
                <div class="campo">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" required></select>
                </div>
                <div class="campo">
                    <label for="edicao">Edição</label>
                    <input id="edicao" maxlength="30">
                </div>
                <div class="campo">
                    <label for="editora">Editora</label>
                    <input id="editora" maxlength="80">
                </div>
                <div class="campo">
                    <label for="ano">Ano</label>
                    <input id="ano" type="number" min="0" max="9999">
                </div>
                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input id="preco" type="number" min="0" max="99999999.99" step="0.01" required>
                </div>
                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="disponivel">Disponível</option>
                        <option value="indisponivel">Indisponível</option>
                        <option value="reservado">Reservado</option>
                        <option value="vendido">Vendido</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="capa">Capa (caminho ou URL)</label>
                    <input id="capa" maxlength="255">
                </div>
            </div>
            <button type="submit" class="btn-primario">Salvar livro</button>
            <button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button>
        </form>

        <div class="tabela-box">
            <table id="tabelaLivros">
                <thead>
                    <tr><th>ID</th><th>Título</th><th>Autor</th><th>Assunto</th><th>Preço</th><th>Status</th><th>Ações</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</main>
<script src="../js/dados.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
